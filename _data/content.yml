### Services [ services ]
services:
  title: "전문 분야"
  subtitle: "핵심 <b>역량</b>"
  bg_title: "Services"

  items:
    - title: "보안 취약점 분석"
      subtitle: "Penetration Testing"
      text: "웹 애플리케이션과 네트워크 환경의 취약점을 식별하고 보고서를 작성합니다. OWASP Top 10 기반으로 분석합니다."
      button_label: "연락하기"
      button_link: "#contacts-section"

    - title: "보안 도구 개발"
      subtitle: "Python / Bash"
      text: "반복 작업 자동화와 보안 점검을 위한 스크립트 및 도구를 개발합니다."
      button_label: "포트폴리오 보기"
      button_link: "#portfolio-section"

    - title: "보안 교육 및 문서화"
      subtitle: "Technical Writing"
      text: "학습한 내용을 블로그로 정리하고, 팀원들과 지식을 공유합니다."
      button_label: "블로그 보기"
      button_link: "blog/"

### Skills [ skills ]
skills:
  title: "기술 역량"
  subtitle: "보유 <b>스킬</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "Python"
        text: "자동화 스크립트, 보안 도구 개발, 데이터 처리"
        value: "80"

      - label: "Linux / Bash"
        text: "서버 관리, 쉘 스크립팅, 네트워크 도구 활용"
        value: "75"

  column2:
    items:
      - label: "네트워크 보안"
        text: "패킷 분석, 방화벽 설정, IDS/IPS 운영"
        value: "70"

      - label: "웹 취약점 분석"
        text: "OWASP Top 10, Burp Suite, SQL Injection"
        value: "65"

  column3:
    items:
      - label: "데이터베이스"
        text: "MySQL, SQLite, 기본 쿼리 및 보안 설정"
        value: "60"

      - label: "Git / GitHub"
        text: "버전 관리, 협업 워크플로우, GitHub Pages 배포"
        value: "70"

### Resume [ resume ]
resume:
  title: "이력서"
  subtitle: "학력 및 <b>경력</b>"
  bg_title: "History"

  education:
    title: "학력"
    items:
      - name: "광주소프트웨어마이스터고등학교"
        subname: "software development"
        period: "2020 - 2023"
        text: "전문 계열 소프트웨어 개발과로, 다양한 프로그래밍 언어와 프로젝트 경험을 쌓았습니다."

      - name: "폴리텍 대학 강서캠퍼스"
        subname: "사이버보안과"
        period: "2023 - 2026"
        text: "사이버 보안 분야에 특화된 교육을 받으며, 실무 중심의 학습을 통해 전문성을 키웠습니다."
  
  experience:
  title: "경력 및 활동"
  items:
    - name: "보안 동아리"
      subname: "광주소프트웨어마이스터고등학교"
      period: "2022 - <b>2022</b>"
      text: "교내 보안 동아리를 이끌며 주간 스터디 운영. 팀원 3명과 함께 CTF 문제 풀이 및 보안 이슈 공유. 사이버보안지방기능경기대회에서 금상 수상"

