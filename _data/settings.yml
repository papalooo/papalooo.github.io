# Theme Settings Configuration File
##
### use settings.yml file for configure colors, ui, rtl, sidebar, animation options

### Main Settings
settings:
  skin: "dark" # select initial skin option: "light" or "dark"

### Preloader
preloader:
  logo:
    image: "assets/img/logo2.png"
    alt: "장수혁"

### Header
header:
  logo:
    image: "assets/img/logo2.png"
    alt: "장수혁"

### Social
social:
  - title: "Github"
    icon: "fab fa-github"
    url: "http://github.com/papalooo"

  - title: "Dribbble"
    icon: "fab fa-dribbble"
    url: "http://dribbble.com"

  - title: "Behance"
